<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freie Kompanie</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game3d"></canvas>
      <canvas id="game"></canvas>
      <div id="hud"></div>
      <div id="loading"><div class="title">Freie Kompanie</div><div class="sub">Micro-Arena · Lade Figuren und Gelände …</div><div class="bar"><i></i></div></div>
      <div id="dialogs">
        <div id="result" class="overlay" hidden>
          <div class="dialog">
            <h2 id="result-title"></h2>
            <table id="result-table"></table>
            <div id="result-chart-wrap" class="chart-wrap" hidden>
              <h3>Verlauf der letzten 20 Versuche</h3>
              <canvas id="result-chart" width="560" height="190"></canvas>
              <div id="chart-tooltip" class="tooltip" hidden></div>
            </div>
            <div class="row">
              <button id="result-restart">Neustart (F4)</button>
              <button id="result-replay" hidden>Replay speichern</button>
              <button id="result-close">Schließen</button>
            </div>
          </div>
        </div>
        <div id="daily" class="overlay" hidden>
          <div class="dialog">
            <div class="row space">
              <h2>Daily Challenge</h2>
              <button id="daily-close">Schließen (Esc)</button>
            </div>
            <div id="daily-body"></div>
          </div>
        </div>
        <div id="editor" class="overlay" hidden>
          <div class="dialog wide">
            <div class="row space">
              <h2>Szenario-Editor</h2>
              <button id="editor-close">Schließen (Esc)</button>
            </div>
            <div id="editor-body"></div>
          </div>
        </div>
        <div id="settings" class="overlay" hidden>
          <div class="dialog wide">
            <div class="row space">
              <h2>Einstellungen</h2>
              <button id="settings-close">Schließen (Esc)</button>
            </div>
            <div id="settings-body"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
