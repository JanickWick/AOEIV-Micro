<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AoE4 Micro Trainer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud">
        <div id="hud-top-left" class="hud-panel">
          <div id="scenario-name"></div>
          <div id="scenario-goal" class="muted small"></div>
          <div id="stats" class="muted"></div>
          <div id="unverified-hint" class="warn small" hidden></div>
        </div>
        <div id="hud-top-right" class="hud-panel">
          <label>Szenario <select id="scenario-select"></select></label>
          <button id="btn-restart" title="Neustart (F4)">Neustart</button>
          <button id="btn-pause" title="Pause (F3)">Pause</button>
          <label>Tempo
            <select id="speed-select">
              <option value="0.5">50 %</option>
              <option value="0.75">75 %</option>
              <option value="1">100 %</option>
            </select>
          </label>
          <label><input type="checkbox" id="random-start" /> Zufallsstart</label>
          <button id="btn-settings" title="Einstellungen und Kalibrierung">Einstellungen</button>
          <button id="btn-fullscreen" title="Vollbild">Vollbild</button>
        </div>
        <div id="hud-bottom-right" class="hud-panel">
          <div id="selection-info" class="muted">Keine Auswahl</div>
        </div>
        <div id="hud-help" class="hud-panel muted">
          Linksklick/Ziehen: Auswahl · Doppelklick: alle des Typs · Shift: hinzufügen/entfernen · Rechtsklick: Bewegen / Gegner angreifen · Shift+Rechtsklick: einreihen · S: Stopp · Pfeiltasten/Rand/Mittlere Maustaste: Kamera · Mausrad: Zoom · F4: Neustart · F3: Pause
        </div>
        <div id="result" class="overlay" hidden>
          <div class="dialog">
            <h2 id="result-title"></h2>
            <table id="result-table"></table>
            <div class="row">
              <button id="result-restart">Neustart (F4)</button>
              <button id="result-close">Schließen</button>
            </div>
          </div>
        </div>
        <div id="settings" class="overlay" hidden>
          <div class="dialog wide">
            <div class="row space">
              <h2>Einstellungen</h2>
              <button id="settings-close">Schließen (Esc)</button>
            </div>
            <div id="settings-body"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
