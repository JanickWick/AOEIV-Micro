<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figur-Vorschau – AoE4 Micro Trainer</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; --bg: #14161a; --panel: #1d2026; --line: #3a3f48; --gold: #c9a24f; --text: #e8e2d4; --muted: #9a9484; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
      header { padding: 10px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
      header h1 { margin: 0; font-size: 16px; color: var(--gold); font-weight: 600; }
      header a { color: var(--muted); }
      main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
      canvas { width: 100%; height: 100%; display: block; }
      aside { border-left: 1px solid var(--line); padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 10px; background: var(--panel); }
      aside label { display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-size: 12px; }
      select, input[type=range], button { width: 100%; }
      button { background: #262a31; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 6px; cursor: pointer; }
      button.active { border-color: var(--gold); color: var(--gold); }
      .row { display: flex; gap: 6px; }
      .stat { font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>Figur-Vorschau</h1>
      <span class="stat">Geskinnte Figur mit allen Clips; Ziehen dreht die Kamera, Rad zoomt.</span>
      <a href="./assets-preview.html">Grafik-Vorschau</a>
      <a href="./index.html">Zum Trainer</a>
    </header>
    <main>
      <canvas id="view"></canvas>
      <aside>
        <label>Clip <select id="clip"></select></label>
        <label>Zeit <span id="time-label">0,00</span><input id="time" type="range" min="0" max="1" step="0.001" value="0" /></label>
        <div class="row"><button id="play" class="active">Abspielen</button><button id="team">Team: Blau</button></div>
        <label>Tempo (Wiedergabe) <input id="speed" type="range" min="0.1" max="2" step="0.1" value="1" /></label>
        <label>Oberkörper-Drehung <input id="twist" type="range" min="-1.05" max="1.05" step="0.01" value="0" /></label>
        <label>Überblenden von <select id="prev"></select></label>
        <label>Blend <input id="blend" type="range" min="0" max="1" step="0.01" value="1" /></label>
        <div class="row"><button id="wire">Drahtgitter</button><button id="row3">3 Figuren</button></div>
        <div class="stat" id="stats"></div>
      </aside>
    </main>
    <script type="module" src="/src/figurePreview.ts"></script>
  </body>
</html>
